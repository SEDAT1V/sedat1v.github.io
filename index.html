<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестирование по географии</title>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 25, 44, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      color: var(--text-main);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      line-height: 1.6;
      padding: 50px 20px;
    }

    .container { max-width: 760px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 35px; }
    h1 {
      font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { color: var(--text-muted); font-size: 1.1rem; }

    .card {
      background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); padding: 30px; border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .name-input {
      width: 100%; max-width: 320px; padding: 14px 18px; margin: 15px 0;
      border-radius: 10px; border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05); color: var(--text-main);
      font-size: 1.05rem; outline: none; transition: 0.2s;
    }
    .name-input:focus { border-color: var(--accent-cyan); background: rgba(255, 255, 255, 0.1); }
    
    .quiz-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; color: var(--text-muted); font-size: 0.95rem;
    }
    #timer-display { font-weight: 700; color: var(--accent-cyan); font-size: 1.1rem; }

    .progress-bar-container {
      width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1);
      border-radius: 4px; margin-bottom: 20px; overflow: hidden;
    }
    .progress-bar-fill { height: 100%; width: 10%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-indigo)); transition: width 0.3s ease; }

    #quiz-question { font-size: 1.15rem; margin-bottom: 18px; font-weight: 600; color: #fff; }

    .quiz-option {
      display: block; width: 100%; text-align: left; padding: 14px 18px; margin: 10px 0;
      background: rgba(255, 255, 255, 0.04); color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px;
      cursor: pointer; font-size: 1rem; transition: all 0.2s ease;
    }
    .quiz-option:hover:not(:disabled) { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-cyan); transform: translateX(4px); }
    .correct { background: rgba(34, 197, 94, 0.2) !important; border-color: #22c55e !important; color: #86efac !important; font-weight: 600; }
    .wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #fca5a5 !important; font-weight: 600; }

    #quiz-status { margin-top: 16px; font-size: 0.95rem; padding: 12px 16px; border-radius: 8px; display: none; }

    .quiz-btn {
      margin-top: 18px; padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #090d16; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: 0.2s ease;
    }
    .quiz-btn:hover { opacity: 0.9; }

    .result-box { text-align: center; padding: 10px 0; }
    .result-box h4 { font-size: 1.6rem; margin-bottom: 10px; color: #fff; }
    .send-status { margin-top: 15px; font-size: 0.95rem; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Айдамир</h1>
      <p class="subtitle">Учитель географии | Цифровая образовательная среда</p>
    </header>

    <div class="card" id="quiz-section">
      
      <!-- 1. Стартовый экран -->
      <div id="start-screen" style="text-align: center; padding: 10px 0;">
        <h3 style="font-size: 1.4rem; margin-bottom: 10px;">⚡ Итоговый тест по географии</h3>
        <p style="color: var(--text-muted); margin-bottom: 10px;">Введите ваше имя и фамилию.</p>
        <p style="color: #ef4444; font-size: 0.9rem; margin-bottom: 20px;">Внимание: на каждый вопрос даётся ровно 15 секунд!</p>
        <input type="text" id="student-name" class="name-input" placeholder="Например: Иванов Иван" autocomplete="off">
        <br>
        <button class="quiz-btn" onclick="startQuiz()">Начать тест ⏱️</button>
      </div>

      <!-- 2. Тест -->
      <div id="quiz-container" style="display: none;">
        <div class="quiz-header">
          <span id="question-number">Вопрос 1 из 10</span>
          <span id="timer-display">⏳ 15 сек</span>
          <span id="score-counter">Счёт: 0</span>
        </div>
        <div class="progress-bar-container"><div id="progress-bar" class="progress-bar-fill"></div></div>
        <div id="quiz-question"></div>
        <div id="quiz-options"></div>
        <div id="quiz-status"></div>
        <button id="next-btn" class="quiz-btn" style="display: none;" onclick="nextQuestion()">Следующий вопрос →</button>
      </div>

      <!-- 3. Экран результатов -->
      <div id="quiz-result" class="result-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    // ЗДЕСЬ НУЖНО БУДЕТ ВСТАВИТЬ ВАШУ ССЫЛКУ ИЗ ШАГА 2
    const formspreeLink = "https://formspree.io/f/xyeewanz";

    const questions = [
      { q: "Какое озеро является крупнейшим по площади бессточным водоёмом на Земле?", options: ["Озеро Байкал", "Каспийское море", "Озеро Виктория", "Аральское море"], correct: 1, explanation: "Каспийское море классифицируется как крупнейшее замкнутое бессточное озеро планеты." },
      { q: "Какое государство полностью окружено территорией Южно-Африканской Республики (анклав)?", options: ["Лесото", "Ботсвана", "Намибия", "Зимбабве"], correct: 0, explanation: "Королевство Лесото — классический пример государства-анклава внутри ЮАР." },
      { q: "Какой пролив разделяет Евразию и Северную Америку?", options: ["Гибралтарский", "Дрейка", "Берингов", "Магелланов"], correct: 2, explanation: "Берингов пролив разделяет Чукотский полуостров (Россия) и Аляску (США)." },
      { q: "Какая река считается самой полноводной в мире?", options: ["Нил", "Амазонка", "Янцзы", "Конго"], correct: 1, explanation: "Амазонка несет около 20% мирового речного стока в океан." },
      { q: "Какая страна является лидером в мире по запасам и добыче природного урана?", options: ["Канада", "Австралия", "Казахстан", "Нигер"], correct: 2, explanation: "Казахстан обеспечивает свыше 40% мировой первичной добычи урана." },
      { q: "Как называется самая глубокая впадина Мирового океана?", options: ["Марианский жёлоб", "Зондский жёлоб", "Пуэрто-Рико", "Яванская впадина"], correct: 0, explanation: "Глубина Марианского жёлоба (Бездна Челленджера) составляет около 11 000 метров." },
      { q: "Какая пустыня является самой засушливой на Земле?", options: ["Сахара", "Атакама", "Калахари", "Гоби"], correct: 1, explanation: "Атакама в Южной Америке считается самым засушливым неполярным регионом мира." },
      { q: "Через какую из перечисленных стран проходит нулевой меридиан (Гринвич)?", options: ["Испания", "Германия", "Италия", "Швеция"], correct: 0, explanation: "Нулевой меридиан пересекает Великобританию, Францию, Испанию и несколько стран Африки." },
      { q: "Какой остров является самым большим по площади на планете?", options: ["Мадагаскар", "Калимантан", "Гренландия", "Новая Гвинея"], correct: 2, explanation: "Гренландия — крупнейший остров планеты с площадью более 2,1 млн км²." },
      { q: "Какая горная вершина является высочайшей точкой Казахстана?", options: ["Белуха", "Хан-Тенгри", "Пик Талгар", "Пик Комсомола"], correct: 1, explanation: "Высота пика Хан-Тенгри (Тянь-Шань) составляет 6995 м." }
    ];

    let currentQuestionIndex = 0, score = 0, studentName = "", timerInterval, timeLeft = 15;

    function startQuiz() {
      const nameInput = document.getElementById('student-name').value.trim();
      if (!nameInput) { alert("Пожалуйста, введите ваше имя и фамилию!"); return; }
      studentName = nameInput;
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('quiz-container').style.display = 'block';
      currentQuestionIndex = 0; score = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const qData = questions[currentQuestionIndex];
      document.getElementById('question-number').textContent = `Вопрос ${currentQuestionIndex + 1} из ${questions.length}`;
      document.getElementById('score-counter').textContent = `Счёт: ${score}`;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
      document.getElementById('quiz-question').textContent = qData.q;
      
      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';
      document.getElementById('quiz-status').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      qData.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option'; btn.textContent = optText;
        btn.onclick = () => selectOption(btn, index);
        optionsContainer.appendChild(btn);
      });
      startTimer();
    }

    function startTimer() {
      timeLeft = 15;
      const timerDisplay = document.getElementById('timer-display');
      timerDisplay.textContent = `⏳ ${timeLeft} сек`;
      timerDisplay.style.color = "var(--accent-cyan)";
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `⏳ ${timeLeft} сек`;
        if (timeLeft <= 5) timerDisplay.style.color = "#ef4444";
        if (timeLeft <= 0) { clearInterval(timerInterval); autoSkipQuestion(); }
      }, 1000);
    }

    function autoSkipQuestion() {
      currentQuestionIndex++;
      currentQuestionIndex < questions.length ? renderQuestion() : showResults();
    }

    function selectOption(button, selectedIndex) {
      clearInterval(timerInterval);
      const qData = questions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.quiz-option');
      const status = document.getElementById('quiz-status');
      const nextBtn = document.getElementById('next-btn');

      buttons.forEach(btn => btn.disabled = true);
      status.style.display = 'block';

      if (selectedIndex === qData.correct) {
        button.classList.add('correct'); score++;
        document.getElementById('score-counter').textContent = `Счёт: ${score}`;
        status.innerHTML = `✅ <b>Верно!</b> ${qData.explanation}`;
        status.style.background = "rgba(34, 197, 94, 0.1)"; status.style.border = "1px solid rgba(34, 197, 94, 0.3)"; status.style.color = "#86efac";
      } else {
        button.classList.add('wrong'); buttons[qData.correct].classList.add('correct');
        status.innerHTML = `❌ <b>Неверно.</b> ${qData.explanation}`;
        status.style.background = "rgba(239, 68, 68, 0.1)"; status.style.border = "1px solid rgba(239, 68, 68, 0.3)"; status.style.color = "#fca5a5";
      }

      nextBtn.textContent = currentQuestionIndex < questions.length - 1 ? "Следующий вопрос →" : "Завершить викторину 🏁";
      nextBtn.style.display = 'inline-block';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      currentQuestionIndex < questions.length ? renderQuestion() : showResults();
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('quiz-container').style.display = 'none';
      const resultBox = document.getElementById('quiz-result');
      resultBox.style.display = 'block';

      let message = score >= 7 ? "Отличный уровень знаний!" : "Нужно повторить материал.";

      resultBox.innerHTML = `
        <h4>Тест завершён!</h4>
        <p style="color: #fff; font-size: 1.2rem; margin-bottom: 5px;">Ученик: <b>${studentName}</b></p>
        <p>Итоговый результат: <b>${score} из ${questions.length}</b></p>
        <p style="color: var(--accent-cyan); font-weight: 500; margin-bottom: 10px;">${message}</p>
        
        <div id="send-status" class="send-status" style="background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3);">
          ⏳ Идёт отправка результатов учителю...
        </div>
        <button class="quiz-btn" style="margin-top: 20px;" onclick="restartQuiz()">Пройти ещё раз</button>
      `;

      sendResultToEmail();
    }

    function sendResultToEmail() {
      const statusDiv = document.getElementById('send-status');
      
      if (formspreeLink === "ВСТАВЬТЕ_ССЫЛКУ_СЮДА") {
        statusDiv.innerHTML = "⚠️ <i>Отправка отключена (нужно вставить ссылку Formspree в код)</i>";
        statusDiv.style.background = "transparent"; statusDiv.style.border = "none";
        return;
      }

      fetch(formspreeLink, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ "Ученик": studentName, "Оценка": `${score} из 10`, "Предмет": "География" })
      })
      .then(res => {
        if (res.ok) {
          statusDiv.innerHTML = "✅ Результаты успешно отправлены учителю!";
          statusDiv.style.background = "rgba(34, 197, 94, 0.1)"; statusDiv.style.color = "#86efac"; statusDiv.style.border = "1px solid rgba(34, 197, 94, 0.3)";
        } else { throw new Error('Network response was not ok'); }
      })
      .catch(err => {
        statusDiv.innerHTML = "❌ Ошибка при отправке результатов.";
        statusDiv.style.background = "rgba(239, 68, 68, 0.1)"; statusDiv.style.color = "#fca5a5"; statusDiv.style.border = "1px solid rgba(239, 68, 68, 0.3)";
      });
    }

    function restartQuiz() {
      document.getElementById('quiz-result').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
      document.getElementById('student-name').value = "";
    }
  </script>
</body>
</html>
